version: "3.9"

services:
  nube-db:
    image: mariadb:11
    container_name: nube-db
    hostname: nube-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: empresa
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppass
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nube-net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  nube-web:
    build: ./app-php
    container_name: nube-web
    hostname: nube-web
    depends_on:
      nube-db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DB_HOST: nube-db
      DB_PORT: 3306
      DB_NAME: empresa
      DB_USER: appuser
      DB_PASSWORD: apppass
      APP_REQUIRED_PORT: 8080
    ports:
      - "8080:80"
    networks:
      - nube-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  db_data:

networks:
  nube-net:
